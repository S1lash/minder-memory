  - docs/upgrade-1.0.0.md

# --- Seed contract (three conventions, made explicit so nothing drifts) ---
# Every seed file is EXACTLY one of three kinds. The kind is DECLARED, never
# guessed from the file extension:
#
#   1. strip-seed  — listed in `template:` and NOT in `seed_skill:`. release_engine
#                    renames `X.template.<ext>` → `X.<ext>` (any extension) at
#                    release; the stripped file MUST exist in a fresh clone because
#                    the system reads it directly. Most seeds are this (the *.md).
#   2. skill-seed  — listed in BOTH `template:` and `seed_skill:`. Ships verbatim
#                    (`.template` suffix KEPT); the named owning skill copies it to
#                    its live name on first run when the live file is missing.
#   3. layered     — NOT in `template:`. A `*.template.yaml` under the engine
#                    `_system/scripts/` dir, read directly by the runtime loader as
#                    a baseline; owner overrides live in `*.local.yaml` (never
#                    shipped). See the metric-day note below.
#
# `sync_engine.sh` never touches `template:` paths (owner data after seeding);
# only engine paths sync. The `check_seed_contract.py` gate enforces every
# invariant of this contract at release AND in CI — a mis-declared seed fails
# the release, so this contract cannot silently rot.

